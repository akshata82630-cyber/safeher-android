name: Build SafeHer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Create this GitHub repository variable after hosting the PHP app.
      SAFEHER_SERVER_URL: ${{ vars.SAFEHER_SERVER_URL }}
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Capacitor
        run: npm install
      - name: Create Android project and sync configuration
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeHer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
